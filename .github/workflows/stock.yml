name: Refresh live stock

on:
  schedule:
    # Staggered minutes — GitHub schedule is often delayed/skipped; do not rely on it alone.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-refresh
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch stock from ImpressIoT
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: node scripts/fetch-stock.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stock.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock.json
          git commit -m "chore: refresh live stock $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
