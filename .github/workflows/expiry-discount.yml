name: Expiry discounts

on:
  schedule:
    # 07:00 Europe/Berlin in CEST (UTC+2) = 05:00 UTC; winter CET (UTC+1) = 06:00 UTC
    - cron: "0 5 * * *"
    # Fallback ~08:00 Berlin CEST — no-ops if already ran today (script is idempotent)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expiry-discount
  cancel-in-progress: false

jobs:
  discount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci --omit=dev
      - name: Run expiry discount job
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: node scripts/expiry-discount.mjs --apply
      - name: Refresh public stock.json
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: node scripts/fetch-stock.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/discounts.json data/stock.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discounts.json data/stock.json
          git commit -m "chore: expiry discounts $(date -u +%Y-%m-%d)"
          git push
