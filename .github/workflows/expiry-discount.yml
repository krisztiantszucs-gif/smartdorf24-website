name: Expiry discounts

on:
  schedule:
    # Morning ~07:00 Europe/Berlin (CEST=05:00 UTC, CET=06:00 UTC)
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    # Evening −70% cut-over ~18:00 Berlin (CEST=16:00 UTC, CET=17:00 UTC)
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    # Weekly clearance re-eval backup ~07:15 Berlin Monday (CEST=05:15 UTC)
    - cron: "15 5 * * 1"
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expiry-discount
  cancel-in-progress: false

jobs:
  discount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci --omit=dev
      - name: Video deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil
      - name: Refresh stock (for combined ad thumbnails)
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: node scripts/fetch-stock.mjs
      - name: Weekly clearance re-eval (Monday Berlin)
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: |
          day=$(TZ=Europe/Berlin date +%u)
          if [[ "$day" == "1" ]]; then
            node scripts/clearance-eval.mjs --reeval
          else
            echo "Not Monday (Berlin weekday=$day) — skip clearance re-eval"
          fi
      - name: Run expiry discount job
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: node scripts/expiry-discount.mjs --apply
      - name: Refresh public stock.json
        env:
          IMPRESSIOT_USERNAME: ${{ secrets.IMPRESSIOT_USERNAME }}
          IMPRESSIOT_PASSWORD: ${{ secrets.IMPRESSIOT_PASSWORD }}
        run: node scripts/fetch-stock.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/discounts.json data/stock.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discounts.json data/stock.json
          git commit -m "chore: expiry discounts $(date -u +%Y-%m-%d)"
          git push
